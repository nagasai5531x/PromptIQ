services:
  - type: web
    name: promptiq
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build:node
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NITRO_PRESET
        value: node-server
      - key: GROQ_API_KEY
        sync: false
